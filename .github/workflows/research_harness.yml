name: Research Harness CI

on:
  push:
    branches: [main, project1/final-scientific-hardening]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q
      - run: python scripts/scientific_audit.py > audit-ci.json 2>&1 || test $? -eq 1
      - run: |
          python - <<'PY'
          import json
          d=json.load(open("audit-ci.json"))
          assert d["status"] == "FAIL"
          assert any("Benchmark" in x for x in d["preflight"]["failures"])
          PY
